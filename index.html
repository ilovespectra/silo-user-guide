<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11100f" />
    <link rel="icon" type="image/png" href="/assets/silo-logo.png" />
    <meta name="description" content="The complete Silo user guide: setup, search, indexing, people, offline references, backups, privacy and troubleshooting." />
    <title>Silo User Guide</title>
    <script>
      try {
        const saved = localStorage.getItem('silo-guide-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
